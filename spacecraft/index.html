<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CorpHQ — Fleet Command</title>
<meta name="description" content="CorpHQ — a free fleet-command console for SpaceCraft corps: shared bases, capacity-aware production chains, galaxy map & FTL routes, resource finder.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23fd563c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.0/src/fill/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-display:"Poppins","Inter",sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --page:#04060b;
  --panel-a:rgba(8,18,34,.9); --panel-b:rgba(4,9,18,.92);
  --panel-bd:rgba(96,165,215,.18);
  --hair:rgba(96,180,240,.12);
  --inset:rgba(6,14,26,.5);
  --cyan:#66e0fa; --cyan2:#04aad6;
  --teal:#5fe9ce; --teal2:#15b79f;
  --orange:#fd563c; --orange2:#ff7b66; --orange3:#ff9d8a;
  --amber:#ffd049; --amber2:#fb9c0c;
  --bad:#f04438; --bad2:#fdaaa4;
  --txt-hi:#eaf3fb; --txt:#dce6f2; --txt2:#9fb0c4; --dim:#7d8ba1; --dim2:#566072;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--txt);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
@keyframes hud-sweep{to{transform:rotate(360deg)}}
@keyframes hud-scan{0%{transform:translateY(-100%)}100%{transform:translateY(600%)}}
@keyframes hud-blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes hud-flow{to{stroke-dashoffset:-24}}
@keyframes hud-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(102,224,250,.18);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--cyan);text-decoration:none}
#app{min-height:100vh;display:grid;grid-template-columns:96px 1fr;background:radial-gradient(1200px 700px at 78% -8%, #06305c 0%, #041428 42%, #04060b 78%);position:relative;overflow:hidden}
.gridovl{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(96,180,240,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(96,180,240,.045) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(1100px 800px at 70% 0%, #000 40%, transparent 92%)}
.scanline{position:absolute;left:96px;right:0;top:0;height:16%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(102,224,250,.05),transparent);animation:hud-scan 9s linear infinite}
nav.rail{position:relative;z-index:2;background:linear-gradient(180deg,rgba(6,16,30,.92),rgba(4,9,18,.92));border-right:1px solid rgba(96,165,215,.14);display:flex;flex-direction:column;align-items:center;padding:18px 0 20px;gap:26px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,#fd563c,#c6280f);display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(253,86,60,.5)}
.logo i{font-size:24px;color:#fff}
.navlist{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.navitem{width:66px;padding:9px 0 7px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--dim);background:transparent;border:1px solid transparent;transition:.15s}
.navitem i{font-size:21px}
.navitem span{font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase}
.navitem:hover{background:rgba(102,224,250,.08);color:#cfeefb}
.navitem.active{color:#cfeefb;background:rgba(102,224,250,.1);border-color:rgba(102,224,250,.35)}
.railbtm{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.radar{width:40px;height:40px;border-radius:50%;border:1px solid rgba(102,224,250,.3);display:flex;align-items:center;justify-content:center;position:relative}
.radar::before{content:"";position:absolute;inset:-1px;border-radius:50%;border-top:1px solid var(--cyan);animation:hud-sweep 3.5s linear infinite}
.radar i{font-size:19px;color:var(--cyan)}
.gear{width:36px;height:36px;border-radius:10px;background:rgba(102,224,250,.06);border:1px solid rgba(102,224,250,.16);display:flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer}
.gear i{font-size:20px}
.mainwrap{position:relative;z-index:2;display:flex;flex-direction:column;min-width:0}
header.top{height:64px;flex-shrink:0;border-bottom:1px solid rgba(96,165,215,.14);display:flex;align-items:center;gap:20px;padding:0 26px;background:rgba(6,13,24,.92)}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;color:#fff}
.cmdpill{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;color:var(--cyan);border:1px solid rgba(102,224,250,.3);border-radius:5px;padding:2px 6px}
.corpsw{display:flex;align-items:center;gap:11px;background:rgba(102,224,250,.05);border:1px solid rgba(102,224,250,.16);border-radius:11px;padding:6px 14px 6px 8px;cursor:pointer;color:inherit;font-family:inherit}
.corpsw:hover{border-color:rgba(102,224,250,.35)}
.corpav{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,#04aad6,#0d6d91);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#04121c}
.searchbar{flex:1;display:flex;align-items:center;gap:10px;max-width:400px;background:rgba(6,14,26,.7);border:1px solid rgba(96,165,215,.14);border-radius:11px;padding:8px 13px;color:var(--dim2);font-size:13px;font-family:var(--font-mono)}
.searchbar input{flex:1;background:none;border:0;color:var(--txt);font-family:var(--font-mono);font-size:13px;outline:none}
.searchbar input::placeholder{color:var(--dim2)}
.topright{margin-left:auto;display:flex;align-items:center;gap:16px}
.livesync{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--teal)}
.livesync .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:hud-blink 2s ease-in-out infinite}
.pilotchip{display:flex;align-items:center;gap:9px}
.pilotav{width:34px;height:34px;border-radius:50%;background:linear-gradient(150deg,#fd563c,#872415);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
main.scroll{flex:1;overflow-y:auto;padding:24px 26px 44px;height:calc(100vh - 64px)}
.screen{animation:hud-fade .25s ease}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.22em;color:var(--cyan);margin-bottom:8px}
h1.hud{font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:-.01em;color:#fff;margin:0}
.subtitle{font-size:13.5px;color:#8a94a6;margin-top:6px;max-width:560px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid transparent;transition:.15s}
.btn i{font-size:15px}
.btn-ghost{padding:10px 15px;background:rgba(102,224,250,.06);border-color:rgba(102,224,250,.2);color:#cfeefb}
.btn-ghost:hover{border-color:rgba(102,224,250,.45)}
.btn-primary{padding:10px 16px;background:linear-gradient(150deg,#fd563c,#c6280f);border-color:#ff7b66;color:#fff;box-shadow:0 0 20px rgba(253,86,60,.35)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-cyan{padding:9px 16px;background:linear-gradient(150deg,#04aad6,#0d6d91);border-color:#66e0fa;color:#04121c;font-weight:600}
.btn-cyan:hover{filter:brightness(1.08)}
.panel{position:relative;background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--panel-bd);border-radius:15px;padding:18px 20px 20px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel-eyebrow{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;color:var(--cyan);margin-bottom:5px}
h2.hud{font-family:var(--font-display);font-size:17px;font-weight:600;color:#fff;margin:0}
.mono{font-family:var(--font-mono)}
.corner-tab{position:absolute;top:-1px;left:22px;font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;color:var(--cyan);background:#08182a;padding:2px 9px;border:1px solid rgba(102,224,250,.28);border-top:none;border-radius:0 0 7px 7px}
.chip-ghost{font-family:var(--font-mono);font-size:10px;color:var(--dim);border:1px solid rgba(96,165,215,.18);border-radius:7px;padding:5px 9px;cursor:pointer}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{position:relative;background:linear-gradient(180deg,rgba(9,20,38,.82),rgba(5,11,22,.82));border:1px solid rgba(96,165,215,.16);border-radius:13px;padding:16px 17px 15px;overflow:hidden}
.kpi .accent{position:absolute;top:0;left:0;right:0;height:2px;opacity:.7}
.kpi .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.kpi .val{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.01em;color:#fff;line-height:1}
.kpi .unit{font-family:var(--font-mono);font-size:12px;color:var(--dim)}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px}
.delta i{font-size:12px}
.graph{position:relative;border:1px solid rgba(96,165,215,.1);border-radius:11px;background:radial-gradient(600px 300px at 30% 40%, rgba(6,48,92,.28), transparent 70%);background-image:linear-gradient(rgba(96,180,240,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(96,180,240,.05) 1px,transparent 1px);background-size:100% 100%,30px 30px,30px 30px;overflow:hidden}
.gnode{position:absolute;width:132px;transform:translateY(-50%);background:linear-gradient(180deg,rgba(10,24,44,.96),rgba(6,14,26,.96));border-radius:10px;padding:9px 11px}
.gnode .nm{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--txt-hi)}
.gnode .nm i{font-size:16px}
.gnode .meta{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-family:var(--font-mono);font-size:9.5px;color:var(--dim)}
.tag{padding:1px 6px;border-radius:5px;font-family:var(--font-mono)}
.mini{background:rgba(6,14,26,.6);border:1px solid rgba(96,165,215,.12);border-radius:9px;padding:10px 12px}
.mini .k{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.mini .v{font-family:var(--font-display);font-size:18px;font-weight:600;margin-top:3px}
.bar-track{height:6px;border-radius:99px;background:rgba(96,165,215,.1);overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.listrow{display:flex;align-items:center;gap:13px;padding:11px 13px;border:1px solid rgba(96,165,215,.12);border-radius:11px;background:var(--inset);transition:.15s}
.listrow:hover{border-color:rgba(102,224,250,.3);background:rgba(8,20,38,.7)}
.icontile{border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
table.hud{width:100%;border-collapse:collapse}
table.hud th{font-family:var(--font-mono);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:11px 18px;background:rgba(6,14,26,.55);border-bottom:1px solid rgba(96,165,215,.14)}
table.hud td{padding:13px 18px;border-bottom:1px solid rgba(96,165,215,.07)}
table.hud tbody tr{transition:.12s}
table.hud tbody tr:hover{background:rgba(8,20,38,.6)}
.covpill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px}
.covpill .d{width:5px;height:5px;border-radius:50%;background:currentColor}
.filterchip{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;padding:6px 11px;border-radius:8px;border:1px solid rgba(96,165,215,.18);background:transparent;color:var(--dim);cursor:pointer;transition:.12s}
.filterchip.active{border-color:rgba(102,224,250,.35);background:rgba(102,224,250,.1);color:#cfeefb}
.loadwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--page);z-index:50}
.spinner{width:42px;height:42px;border-radius:50%;border:2px solid rgba(102,224,250,.2);border-top-color:var(--cyan);animation:hud-sweep .9s linear infinite}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#123524;border:1px solid #1f7a4c;color:#7ef0b2;border-radius:9px;padding:8px 16px;z-index:120;font-size:13px;font-family:var(--font-mono);display:none}
@media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){#app{grid-template-columns:1fr}nav.rail{flex-direction:row;position:sticky;top:0;width:100%;height:auto;padding:8px;gap:4px;overflow-x:auto}.navlist{flex-direction:row}.scanline{left:0}}
</style>
</head>
<body>
<div class="loadwrap" id="boot"><div class="spinner"></div><div class="mono" style="color:var(--cyan);font-size:11px;letter-spacing:.2em">INITIALISING FLEET LINK…</div></div>
<div id="app" style="display:none">
  <div class="gridovl"></div>
  <div class="scanline"></div>
  <nav class="rail">
    <div class="logo"><i class="ph-fill ph-shooting-star"></i></div>
    <div class="navlist" id="navlist"></div>
    <div class="railbtm">
      <div class="radar"><i class="ph-fill ph-broadcast"></i></div>
      <div class="gear" title="Settings (classic)" onclick="location.href='./classic.html'"><i class="ph-fill ph-gear-six"></i></div>
    </div>
  </nav>
  <div class="mainwrap">
    <header class="top">
      <div style="display:flex;align-items:center;gap:11px">
        <span class="wordmark">CorpHQ</span>
        <span class="cmdpill">FLEET&nbsp;CMD</span>
      </div>
      <button class="corpsw" id="corpsw" onclick="location.href='./classic.html'">
        <span class="corpav" id="corpAv">NF</span>
        <span style="text-align:left;line-height:1.15">
          <span style="display:block;font-size:13px;font-weight:600;color:var(--txt-hi)" id="corpName">Nebula Freight Co.</span>
          <span style="display:block;font-family:var(--font-mono);font-size:10px;color:var(--dim)" id="corpMeta">CORP-7F2A · 14 pilots</span>
        </span>
        <i class="ph-fill ph-caret-up-down" style="font-size:15px;color:var(--dim)"></i>
      </button>
      <div class="searchbar"><i class="ph-fill ph-magnifying-glass" style="font-size:16px"></i><input id="globalSearch" placeholder="Search items, bases, systems…"></div>
      <div class="topright">
        <div class="livesync"><span class="dot"></span> <span id="syncLbl">LIVE&nbsp;SYNC</span></div>
        <div style="width:1px;height:26px;background:rgba(96,165,215,.16)"></div>
        <i class="ph-fill ph-bell" style="font-size:19px;color:#8a94a6"></i>
        <div class="pilotchip">
          <span class="pilotav" id="pilotAv">RK</span>
          <span style="line-height:1.15">
            <span style="display:block;font-size:12.5px;font-weight:600;color:var(--txt-hi)" id="pilotName">Cmdr. Rukh</span>
            <span style="display:block;font-family:var(--font-mono);font-size:9.5px;color:var(--dim)" id="pilotRole">CORP ADMIN</span>
          </span>
        </div>
      </div>
    </header>
    <main class="scroll" id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SYNC={url:'https://echjwaxjgzhsqyhrlvzj.supabase.co',key:'sb_publishable_KrVSX1GtQrCSpmuHaZbEFw_VXBMNW9C'};
let SB=null, TOKEN=null, USER=null, CORP=null, ROLE=null, MEMBERS=[];
let GAME=null, MARKET=null, ICONS=null, QUADS=[], STATE_BASES=null;
let VIEW='command', QUADKEY='abuxey';
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $main=()=>el('main');
function toast(t){const e=el('toast');e.textContent=t;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',2200);}
function fmtK(n){ n=+n||0; if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M'; if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'K'; return String(Math.round(n)); }
function fmtN(n){ return (+n||0).toLocaleString('en-US'); }
function priceOf(slug){ if(!MARKET||!MARKET.quads)return null; const q=MARKET.quads[QUADKEY]||MARKET.quads[Object.keys(MARKET.quads)[0]]||{}; const p=q[slug]; return p?+p[0]:null; }
function itemIcon(it){ const n=((it&&it.name)||'').toLowerCase(), s=((it&&it.slug)||'').toLowerCase(); const t=re=>re.test(n)||re.test(s);
  if(t(/thruster|engine|rocket|ship|hull|cockpit|wing/))return 'ph-rocket-launch';
  if(t(/circuit|chip|cpu|processor|computer|core/))return 'ph-cpu';
  if(t(/battery|cell|fuel|power|energy/))return 'ph-battery-charging';
  if(t(/plate|alloy|beam|casing|panel|steel|frame|support/))return 'ph-stack';
  if(t(/ore|deposit|nugget|stone|rock|crystal|raw|mineral|ingot/))return 'ph-mountains';
  if(t(/acid|chem|fluid|gas|liquid|refin|oil|water/))return 'ph-flask';
  if(t(/wire|cable|coil|motor|pump|pipe/))return 'ph-lightning';
  return 'ph-cube'; }
function catOf(it){ const n=((it&&it.name)||'').toLowerCase()+' '+((it&&it.slug)||'').toLowerCase();
  if(/ore|nugget|deposit|stone|rock|raw|mineral/.test(n))return 'Raw';
  if(/thruster|engine|rocket|ship|hull|cockpit/.test(n))return 'Propulsion';
  if(/circuit|chip|cpu|processor|core/.test(n))return 'Component';
  if(/battery|cell|fuel/.test(n))return 'Consumable';
  if(/plate|alloy|beam|casing|panel|ingot|wire|coil/.test(n))return 'Component';
  return 'Item'; }
let RECIPE_BY_OUT=null;
function recipeFor(slug){ if(!RECIPE_BY_OUT){RECIPE_BY_OUT={};for(const r of GAME.recipes){if(r.recycling)continue;for(const o of (r.outputs||[])){if(!RECIPE_BY_OUT[o.slug])RECIPE_BY_OUT[o.slug]=r;}}} return RECIPE_BY_OUT[slug]||null; }
function buildCost(slug){ const r=recipeFor(slug); if(!r)return null; let c=0,known=false; for(const ing of r.ingredients){ const p=priceOf(ing.slug); if(p!=null){c+=p*(+ing.qty||1);known=true;} } return known?c:null; }
async function boot(){
  try{
    const [g,m,ic,idx]=await Promise.all([
      fetch('./data/game.json').then(r=>r.json()),
      fetch('./data/market.json').then(r=>r.json()).catch(()=>({quads:{}})),
      fetch('./data/icons.json').then(r=>r.json()).catch(()=>({})),
      fetch('./data/index.json').then(r=>r.json()).catch(()=>[]),
    ]);
    GAME=g; MARKET=m; ICONS=ic; QUADS=idx;
  }catch(e){ console.error('data load',e); }
  try{
    SB=window.supabase.createClient(SYNC.url,SYNC.key);
    const {data}=await SB.auth.getSession();
    if(data&&data.session){ TOKEN=data.session.access_token; USER=data.session.user; await loadCorp(); }
  }catch(e){ console.warn('no session',e); }
  buildNav(); el('boot').style.display='none'; el('app').style.display='grid';
  applyIdentity();
  const h=location.hash.slice(1); if(h&&NAV.some(n=>n[0]===h))VIEW=h;
  render();
}
function authHeaders(extra){ return Object.assign({apikey:SYNC.key,Authorization:'Bearer '+(TOKEN||SYNC.key),'Content-Type':'application/json'},extra||{}); }
async function rpc(fn,args){ try{ const r=await fetch(SYNC.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:authHeaders(),body:JSON.stringify(args||{})}); if(!r.ok)return null; return await r.json(); }catch(e){return null;} }
async function loadCorp(){
  const info=await rpc('corp_info'); if(info&&info.corp){ CORP=info.corp; ROLE=info.role; MEMBERS=info.members||[]; }
  if(CORP){ try{ const r=await fetch(SYNC.url+'/rest/v1/bases?select=*&order=updated_at.desc',{headers:authHeaders()}); if(r.ok)STATE_BASES=await r.json(); }catch(e){} if(CORP.quadrant)QUADKEY=CORP.quadrant; }
}
function applyIdentity(){
  if(CORP){
    el('corpName').textContent=CORP.name||'My Corp';
    el('corpMeta').textContent=(CORP.join_code?('CORP · '+CORP.join_code):'CORP')+' · '+((MEMBERS.length||1))+' pilots';
    el('corpAv').textContent=(CORP.tag||CORP.name||'C').slice(0,2).toUpperCase();
    if(USER){ const nm=(USER.email||'Pilot').split('@')[0]; el('pilotName').textContent=nm; el('pilotRole').textContent=(ROLE||'pilot').toUpperCase(); el('pilotAv').textContent=nm.slice(0,2).toUpperCase(); }
    el('syncLbl').textContent='LIVE SYNC';
  } else { el('syncLbl').textContent='DEMO'; }
}
const NAV=[['command','ph-squares-four','Command'],['bases','ph-planet','Bases'],['chain','ph-flow-arrow','Chains'],['map','ph-map-trifold','Map'],['finder','ph-magnifying-glass','Finder'],['corp','ph-users-three','Corp']];
function buildNav(){ el('navlist').innerHTML=NAV.map(([k,ic,lb])=>`<a class="navitem${k===VIEW?' active':''}" data-k="${k}" onclick="go('${k}')"><i class="ph-fill ${ic}"></i><span>${lb}</span></a>`).join(''); }
function go(k){ VIEW=k; document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',n.dataset.k===k)); if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k); render(); $main().scrollTop=0; }
window.go=go;
window.addEventListener('hashchange',()=>{ const k=location.hash.slice(1); if(k&&NAV.some(n=>n[0]===k)&&k!==VIEW)go(k); });
function render(){ const fn={command:renderCommand,bases:renderBases,chain:renderChainScreen,map:renderMapScreen,finder:renderFinder,corp:renderCorp}[VIEW]||renderCommand; $main().innerHTML='<div class="screen">'+fn()+'</div>'; if(VIEW==='command'&&window.afterCommand)afterCommand(); if(VIEW==='chain'&&window.afterChain)afterChain(); if(VIEW==='map'&&window.afterMap)afterMap(); if(VIEW==='finder'&&window.afterFinder)afterFinder(); }
function head(eyebrow,title,sub,actions){ return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1 class="hud">${title}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}</div>${actions?`<div style="display:flex;gap:9px">${actions}</div>`:''}</div>`; }
</script>
<script src="./hq-screens.js"></script>
<script>boot();</script>
</body>
</html>
